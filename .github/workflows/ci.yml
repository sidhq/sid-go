name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23.x", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - if: matrix.go == 'stable'
        run: go test -race ./...
      # The examples are a separate module: they use the OpenAI Go client, which needs Go 1.25+.
      - if: matrix.go == 'stable'
        working-directory: examples
        run: go vet ./... && go build -o /tmp/sid-reference-implementation ./reference_implementation
